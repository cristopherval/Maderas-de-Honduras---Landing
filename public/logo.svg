<?xml version="1.0" encoding="UTF-8"?>
<!--
  PROVISIONAL. TODO: reemplazar por el trazado del logo real cuando el cliente
  entregue el archivo vectorial (o el JPEG para vectorizarlo).

  Reconstruye el ADN descrito: tres pinos verde bosque y las cinco estrellas
  blancas de la bandera, en quincuncio, dentro de la copa del pino central.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img"
     aria-label="Maderas de Honduras">
  <defs>
    <!-- Estrella de cinco puntas, radio exterior 1, punta arriba. -->
    <path id="estrella-logo"
          d="M0,-1 L0.225,-0.309 L0.951,-0.309 L0.363,0.118 L0.588,0.809
             L0,0.382 L-0.588,0.809 L-0.363,0.118 L-0.951,-0.309 L-0.225,-0.309 Z" />
    <!-- Pino: tres cuerpos y tronco. Origen en el centro, base en y=26. -->
    <g id="pino-logo">
      <path d="M0,-34 L9,-14 L-9,-14 Z" />
      <path d="M0,-24 L14,0 L-14,0 Z" />
      <path d="M0,-10 L17,18 L-17,18 Z" />
      <path d="M-2.5,18 h5 v8 h-5 Z" />
    </g>
  </defs>

  <g fill="#1C4B34">
    <use href="#pino-logo" transform="translate(26 63.7) scale(0.78)" />
    <use href="#pino-logo" transform="translate(94 63.7) scale(0.78)" />
    <use href="#pino-logo" transform="translate(60 58)" />
  </g>

  <g fill="#F8F7F3">
    <use href="#estrella-logo" transform="translate(60 66) scale(4)" />
    <use href="#estrella-logo" transform="translate(52 58) scale(3.6)" />
    <use href="#estrella-logo" transform="translate(68 58) scale(3.6)" />
    <use href="#estrella-logo" transform="translate(52 74) scale(3.6)" />
    <use href="#estrella-logo" transform="translate(68 74) scale(3.6)" />
  </g>
</svg>
